spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/librarydb?options=-c%20TimeZone%3DUTC
    username: postgres
    password: changeit
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework: INFO

jwt:
  secret: ${JWT_SECRET:Zm9yLWhTMjU2LXdlLW5lZWQtMzItYnl0ZXMhIQ==JKAFlksdf}
  expiration-ms: 86400000

session:
  ttl-hours: 24
  secure-cookie: false

email:
  verification:
    ttl-minutes: 15
    resend-seconds: 60

# Локальний скид пароля admin (видаліть або закоментуйте після першого входу)
library:
  bootstrap:
    reset-admin-password: admin
